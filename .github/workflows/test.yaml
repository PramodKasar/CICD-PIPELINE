name: Model Training CICD

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - uses: iterative/setup-cml@v2

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install -r requirements.txt
          python train_model.py

          echo "RF and LR Model Score" > report.md
          cat scores.txt >> report.md

          echo "Confusion Matrix & Feature Importance" > report1.md
          echo "Images are available in GitHub Actions Artifacts." >> report1.md

          cat report.md report1.md > combined_file.md

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment create combined_file.md --target pr/${{ github.event.pull_request.number }} --publish false
          else
            cml comment create combined_file.md --target commit/${{ github.sha }} --publish false
          fi

      - name: Upload Model Images
        uses: actions/upload-artifact@v4
        with:
          name: Model-Training-Images
          path: |
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: error
