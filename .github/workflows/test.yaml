name: Model Training CICD

permissions:
  id-token: write
  contents: write
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

jobs:
  run:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libcairo2-dev \
            libjpeg-dev \
            libpango1.0-dev \
            libgif-dev \
            librsvg2-dev

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - uses: iterative/setup-cml@v2

      - name: Train model
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python train_model.py

          echo "# Machine Learning Model Evaluation" > report.md
          echo "" >> report.md

          echo "## Model Accuracy and Performance" >> report.md
          cat scores.txt >> report.md

          echo "" >> report.md
          echo "## Confusion Matrix" >> report.md
          echo "Confusion matrix is available in GitHub Actions Artifacts." >> report.md

          echo "" >> report.md
          echo "## Feature Importance" >> report.md
          echo "Feature importance is available in GitHub Actions Artifacts." >> report.md

      - name: Publish CML Report
        env:
          REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            cml comment create report.md --target pr/${{ github.event.pull_request.number }} --no-publish
          else
            cml comment create report.md --target commit/${{ github.sha }} --no-publish
          fi

      - name: Upload Model Results
        uses: actions/upload-artifact@v4
        with:
          name: Model-Training-Results
          path: |
            scores.txt
            ConfusionMatrix.png
            FeatureImportance.png
          if-no-files-found: error
